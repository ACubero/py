name = "wegoby-push"
main = "src/index.js"
compatibility_date = "2026-10-01"

[triggers]
crons = ["*/15 * * * *"]

[[kv_namespaces]]
binding = "DEVICES"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[vars]
ALLOWED_ORIGIN = "https://REPLACE_WITH_APP_ORIGIN"
VAPID_SUBJECT = "https://REPLACE_WITH_APP_ORIGIN"
VAPID_PUBLIC_KEY = "REPLACE_WITH_VAPID_PUBLIC_KEY"
# VAPID_PRIVATE_KEY is a secret: npx wrangler secret put VAPID_PRIVATE_KEY
